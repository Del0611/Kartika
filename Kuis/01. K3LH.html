        // --- KONFIGURASI GAME ---
        const MAX_WRONG = 10;
        const TOTAL_QUESTIONS = 50;
        const TIME_LIMIT = 15 * 60; // 15 Menit dalam detik (900 detik)

        let state = {
            screen: 'home', // home, material, quiz, gameover, result
            playerName: '',
            activeTab: 0,
            questions: [],
            currentQIndex: 0,
            wrongCount: 0,
            score: 0,
            selectedAnswer: null,
            shuffledOptions: [],
            gameOverReason: '' // 'mistakes' atau 'timeout'
        };

        let timerInterval = null;
        let timeLeft = 0;

        // --- UTILITY ---
        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // --- TIMER LOGIC ---
        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = TIME_LIMIT;
            timerInterval = setInterval(() => {
                timeLeft--;
                const timerEl = document.getElementById('timer-display');
                if (timerEl) {
                    timerEl.innerText = formatTime(timeLeft);
                    // Jika waktu sisa < 3 menit, ubah warna jadi merah & berkedip
                    if (timeLeft <= 180) {
                        timerEl.classList.remove('text-indigo-900');
                        timerEl.classList.add('text-rose-600', 'animate-pulse');
                    }
                }
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    state.screen = 'gameover';
                    state.gameOverReason = 'timeout';
                    renderApp();
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        const root = document.getElementById('root');

                        <p class="text-gray-500 mb-8">Pengenalan Dunia Kerja, Profesi & K3</p>
                        
                        <div class="relative mb-6">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-user text-gray-400"></i>
                            </div>
                            <input id="playerNameInput" type="text"
                                class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl leading-5 bg-gray-50 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all"
                                placeholder="Masukkan Namamu..."
                                value="${state.playerName}"
                                oninput="state.playerName = this.value"
                            />
                        </div>

                        <div class="space-y-4">
                            <button onclick="setScreen('material')" 
                                class="w-full flex items-center justify-center gap-2 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 font-bold py-3 px-4 rounded-xl transition-all shadow-sm">
                                <i class="fas fa-book"></i> Pelajari Materi
                            </button>
                            
                            <button onclick="startQuiz()" 
                                class="w-full flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-md transform hover:scale-105">
                                <i class="fas fa-gamepad"></i> Mulai Kuis Sekarang!
                            </button>
                        </div>
                    </div>
                    <div class="mt-8 bg-white/60 p-4 rounded-xl shadow-sm text-sm text-gray-600 max-w-md text-left">
                        <p class="font-bold mb-2 border-b border-gray-200 pb-1"><i class="fas fa-circle-info text-indigo-500"></i> Aturan Main:</p>
                        <ul class="list-disc pl-5 space-y-1">
                            <li>Total soal <strong>50 butir</strong> dari materi Bab 1.</li>
                            <li>Waktu pengerjaan maksimal <strong>15 Menit</strong>.</li>
                            <li>Game Over jika waktu habis ATAU kamu melakukan <strong>10 Kesalahan</strong>.</li>
                        </ul>
                    </div>
                </div>
            `;
        }

        function renderMaterial() {
            const tabsHtml = materials.map((mat, idx) => `
                <button onclick="setActiveTab(${idx})" 
                    class="w-full text-left p-3 rounded-lg transition-all text-sm font-medium ${state.activeTab === idx ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}">
                    ${mat.chapter}
                </button>
            `).join('');

            return `
                <div class="flex flex-col min-h-screen bg-gray-50 p-4 md:p-8 animate-fade-in">
                    <div class="max-w-5xl mx-auto w-full bg-white rounded-2xl shadow-lg overflow-hidden flex flex-col md:flex-row min-h-[85vh]">
                        <div class="w-full md:w-1/3 bg-slate-800 text-white p-6 flex flex-col">
                            <button onclick="setScreen('home')" class="flex items-center gap-2 text-slate-300 hover:text-white mb-8 transition-colors w-fit">
                                <i class="fas fa-arrow-left"></i> Kembali
                            </button>
                            <h2 class="text-xl font-bold mb-6 border-b border-slate-600 pb-2">Materi Bab 1</h2>
                            <div class="flex-1 space-y-2">
                                ${tabsHtml}
                            </div>
                        </div>
                        <div class="w-full md:w-2/3 p-6 md:p-10 overflow-y-auto max-h-[85vh] prose prose-indigo">
                            <h2 class="text-2xl font-extrabold text-gray-800 mb-6 border-b pb-4">
                                ${materials[state.activeTab].chapter}
                            </h2>
                            <div class="text-gray-700 leading-relaxed">
                                ${materials[state.activeTab].content}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderQuiz() {
            if (!state.questions.length) return '';
            const question = state.questions[state.currentQIndex];
            const progress = ((state.currentQIndex) / TOTAL_QUESTIONS) * 100;

            let optionsHtml = state.shuffledOptions.map((opt) => {
                let btnStyle = "bg-gray-50 border-gray-200 text-gray-700 hover:bg-indigo-50 hover:border-indigo-300";
                let iconHtml = '';

                if (state.selectedAnswer) {
                    if (opt === question.answer) {
                        btnStyle = "bg-emerald-100 border-emerald-500 text-emerald-800";
                        iconHtml = '<i class="fas fa-check-circle text-emerald-600"></i>';
                    } else if (opt === state.selectedAnswer) {
                        btnStyle = "bg-rose-100 border-rose-500 text-rose-800";
                        iconHtml = '<i class="fas fa-times-circle text-rose-600"></i>';
                    } else {
                        btnStyle = "bg-gray-50 border-gray-100 text-gray-400 opacity-50";
                    }
                }
                const disabled = state.selectedAnswer ? 'disabled' : '';

                return `
                    <button ${disabled} onclick="handleAnswer('${opt}')" 
                        class="w-full text-left p-4 rounded-xl border-2 font-medium transition-all flex justify-between items-center ${btnStyle}">
                        <span>${opt}</span>
                        ${iconHtml}
                    </button>
                `;
            }).join('');

            return `
                <div class="flex flex-col min-h-screen bg-slate-100 p-4 md:p-8 items-center justify-center animate-fade-in">
                    <div class="w-full max-w-3xl bg-white rounded-3xl shadow-xl overflow-hidden">
                        
                        <!-- Header Status -->
                        <div class="bg-indigo-100 p-4 text-indigo-900 border-b border-indigo-200 grid grid-cols-3 items-center">
                            <div class="text-left font-bold text-sm md:text-base truncate pr-2">
                                <i class="fas fa-user text-indigo-500"></i> ${state.playerName}
                            </div>
                            
                            <!-- TIMER DISPLAY -->
                            <div class="text-center font-black text-2xl tracking-wider flex items-center justify-center gap-2">
                                <i class="fas fa-clock text-indigo-400 text-lg"></i>
                                <span id="timer-display">${formatTime(timeLeft)}</span>
                            </div>

                            <div class="text-right font-bold text-rose-600 text-sm md:text-base flex items-center justify-end gap-1">
                                Salah: ${state.wrongCount}/${MAX_WRONG}
                                <i class="fas fa-heart-crack ${state.wrongCount >= (MAX_WRONG-2) ? 'animate-pulse' : ''}"></i>
                            </div>
                        </div>

                        <!-- Progress Bar -->
                        <div class="w-full bg-slate-200 h-2">
                            <div class="bg-emerald-500 h-2 transition-all duration-500" style="width: ${progress}%;"></div>
                        </div>

                        <!-- Question Area -->
                        <div class="p-6 md:p-10">
                            <div class="flex justify-between text-xs font-bold text-gray-400 mb-4 uppercase tracking-wider">
                                <span>Soal ${state.currentQIndex + 1} / ${TOTAL_QUESTIONS}</span>
                                <span>Skor: ${state.score}</span>
                            </div>
                            
                            <h3 class="text-lg md:text-xl font-bold text-gray-800 mb-8 min-h-[70px]">
                                ${question.q}
                            </h3>

                            <div class="space-y-3">
                                ${optionsHtml}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderGameOver() {
            let message = state.gameOverReason === 'timeout' 
                ? "Waktu 15 menit kamu sudah habis!" 
                : "Kamu telah mencapai batas maksimal 10 kesalahan.";
                
            return `
                <div class="flex flex-col items-center justify-center min-h-screen p-6 text-center bg-rose-50 animate-fade-in">
                    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md border-t-8 border-rose-500">
                        <div class="w-20 h-20 bg-rose-100 rounded-full flex items-center justify-center mx-auto mb-6">
                            <i class="fas fa-clock text-rose-500 text-4xl"></i>
                        </div>
                        <h1 class="text-4xl font-extrabold text-gray-800 mb-2">Game Over!</h1>
                        <p class="text-gray-600 mb-6 font-medium">${message}</p>
                        
                        <div class="bg-gray-50 rounded-xl p-4 mb-8">
                            <p class="text-sm text-gray-500 font-medium">Soal Terjawab Benar</p>
                            <p class="text-3xl font-bold text-indigo-600">${state.score}</p>
                        </div>

                        <button onclick="setScreen('home')" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-lg transform hover:-translate-y-1">
                            Kembali ke Awal
                        </button>
                    </div>
                </div>
            `;
        }

        function renderResult() {
            const percentage = (state.score / TOTAL_QUESTIONS) * 100;
            let grade = ""; let color = "";
            if (percentage >= 90) { grade = "Luar Biasa!"; color = "text-emerald-600"; }
            else if (percentage >= 70) { grade = "Bagus Sekali!"; color = "text-blue-600"; }
            else if (percentage >= 50) { grade = "Cukup Baik."; color = "text-yellow-600"; }
            else { grade = "Perlu Banyak Belajar!"; color = "text-rose-600"; }

            return `
                <div class="flex flex-col items-center justify-center min-h-screen p-6 text-center bg-indigo-50 animate-fade-in">
                    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md border-t-8 border-emerald-500">
                        <div class="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                            <i class="fas fa-trophy text-emerald-500 text-4xl"></i>
                        </div>
                        <h1 class="text-3xl font-extrabold text-gray-800 mb-2">Selesai, ${state.playerName}!</h1>
                        <p class="text-gray-600 mb-6 font-medium">Kamu berhasil menyelesaikan kuis Bab 1.</p>
                        
                        <div class="bg-slate-50 rounded-2xl p-6 mb-8 border border-slate-100 shadow-sm">
                            <p class="text-sm text-gray-500 font-bold uppercase tracking-widest mb-1">Skor Akhir</p>
                            <p class="text-5xl font-black text-slate-800 mb-2">${state.score} <span class="text-2xl text-slate-400">/ ${TOTAL_QUESTIONS}</span></p>
                            <p class="font-bold text-lg ${color}">${grade}</p>
                            <p class="text-xs text-gray-400 mt-2">Waktu Tersisa: ${formatTime(timeLeft)}</p>
                        </div>

                        <button onclick="setScreen('home')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-lg transform hover:-translate-y-1">
                            Main Lagi
                        </button>
                    </div>
                </div>
            `;
        }

        let isRendering = false;
        function renderApp() {
            if (isRendering) return;
            isRendering = true;
            let html = '';
            switch (state.screen) {
                case 'home': html = renderHome(); break;
                case 'material': html = renderMaterial(); break;
                case 'quiz': html = renderQuiz(); break;
                case 'gameover': html = renderGameOver(); break;
                case 'result': html = renderResult(); break;
            }
            root.innerHTML = html;
            isRendering = false;
        }

        // --- GLOBAL ACTIONS ---
        window.setScreen = function(screen) {
            stopTimer(); // Hentikan timer jika pindah halaman
            if (screen === 'home') {
                state.screen = 'home';
                state.questions = [];
                state.currentQIndex = 0;
                state.wrongCount = 0;
                state.score = 0;
                state.selectedAnswer = null;
                state.gameOverReason = '';
            } else {
                state.screen = screen;
            }
            renderApp();
        };

        window.setActiveTab = function(idx) {
            state.activeTab = idx;
            renderApp();
        };

        window.startQuiz = function() {
            if (!state.playerName.trim()) {
                alert("Silakan masukkan namamu terlebih dahulu!");
                return;
            }
            const shuffled = shuffleArray(rawQuestionBank);
            state.questions = shuffled;
            state.currentQIndex = 0;
            state.wrongCount = 0;
            state.score = 0;
            state.selectedAnswer = null;
            state.shuffledOptions = shuffleArray(shuffled[0].options);
            state.screen = 'quiz';
            
            renderApp();
            startTimer(); // Mulai timer 15 Menit
        };

        window.handleAnswer = function(option) {
            if (state.selectedAnswer) return;

            const correct = option === state.questions[state.currentQIndex].answer;
            state.selectedAnswer = option;

            if (correct) { state.score += 1; } 
            else { state.wrongCount += 1; }

            renderApp();

            setTimeout(() => {
                if (!correct && state.wrongCount >= MAX_WRONG) {
                    stopTimer();
                    state.screen = 'gameover';
                    state.gameOverReason = 'mistakes';
                    renderApp();
                    return;
                }
                if (state.currentQIndex + 1 >= TOTAL_QUESTIONS) {
                    stopTimer();
                    state.screen = 'result';
                    renderApp();
                    return;
                }
                // Next Question
                state.currentQIndex += 1;
                state.selectedAnswer = null;
                state.shuffledOptions = shuffleArray(state.questions[state.currentQIndex].options);
                renderApp();
            }, 1200);
        };

        // Mulai aplikasi
        renderApp();
    </script>
</body>
</html>
