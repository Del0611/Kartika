        }
        .prose h3 { 
            font-size: 1.25rem; 
            font-weight: 700; 
            margin-top: 1.5rem; 
            margin-bottom: 0.75rem; 
            color: #1e293b; 
        }

            font-size: 1.1rem; 
            font-weight: 600; 
            margin-top: 1.25rem; 
            margin-bottom: 0.5rem;

        }

        .prose ul { 
            list-style-type: disc; 
            padding-left: 1.5rem; 
            margin-bottom: 1.5rem; 
        }

</head>
<body>
    <div id="root"></div>

    <script>
        // ------------------------------------------------------------
        // DATA MATERI BERDASARKAN INPUT TEKS
        // ------------------------------------------------------------
        const materials = [
          {
            chapter: "1.1 Kecakapan Kerja",
            content: `
              <h3>A. Pengertian</h3>
              <p>Kecakapan kerja adalah kemampuan yang harus dimiliki seseorang agar bisa bekerja dengan baik, produktif, dan profesional. Kecakapan kerja terbagi menjadi dua:</p>
              <table>
                <tr><th>Jenis</th><th>Penjelasan</th><th>Contoh</th></tr>
                <tr><td>Hard Skills</td><td>Kemampuan teknis yang spesifik</td><td>Coding, menginstal jaringan, desain grafis</td></tr>
                <tr><td>Soft Skills</td><td>Kemampuan interpersonal dan karakter</td><td>Komunikasi, kerja tim, disiplin</td></tr>
              </table>

              <h3>B. Mengapa Kecakapan Kerja Penting?</h3>
              <ul>
                <li><strong>Dunia kerja semakin kompetitif:</strong> Perusahaan mencari orang yang tidak hanya pintar tapi juga profesional.</li>
                <li><strong>Kemampuan beradaptasi:</strong> Teknologi berubah cepat, kita harus bisa belajar hal baru.</li>
                <li><strong>Bekerja dalam tim:</strong> Hampir semua pekerjaan dilakukan dalam tim.</li>
                <li><strong>Karir jangka panjang:</strong> Soft skills membantu naik jabatan.</li>
              </ul>

              <h3>C. Contoh Kecakapan Kerja untuk Siswa SMK</h3>
              <ul>
                <li><strong>Disiplin:</strong> Menaati aturan dan tepat waktu (Datang ke sekolah tepat waktu).</li>
                <li><strong>Tanggung Jawab:</strong> Bertanggung jawab atas tugas (Menyelesaikan proyek dengan baik).</li>
                <li><strong>Kerja Sama:</strong> Bekerja dengan orang lain (Kerja kelompok).</li>
                <li><strong>Komunikasi:</strong> Menyampaikan ide dengan jelas (Presentasi).</li>
                <li><strong>Kreativitas:</strong> Berpikir out of the box (Membuat karya orisinal).</li>
                <li><strong>Etos Kerja:</strong> Rajin dan ulet (Tidak mudah menyerah).</li>
              </ul>
            `
          },
          {
            chapter: "1.2 Profesi IT & Game Dev",
            content: `
              <h3>A. Profesi di Bidang IT</h3>
              <ul>
                <li><strong>Programmer/Developer:</strong> Membuat aplikasi/software. (Skill: Coding, logika)</li>
                <li><strong>Network Engineer:</strong> Mengelola jaringan komputer. (Skill: Konfigurasi router, switch)</li>
                <li><strong>Database Administrator:</strong> Mengelola database. (Skill: SQL, backup)</li>
                <li><strong>System Analyst:</strong> Menganalisis kebutuhan sistem. (Skill: Analisis, komunikasi)</li>
                <li><strong>UI/UX Designer:</strong> Mendesain antarmuka aplikasi. (Skill: Figma, psikologi pengguna)</li>
                <li><strong>Game Developer:</strong> Membuat game. (Skill: Unity, C#)</li>
                <li><strong>IT Support:</strong> Membantu pengguna dengan masalah IT.</li>
              </ul>

              <h3>B. Profesi di Game Development</h3>
              <ul>
                <li><strong>Game Designer:</strong> Merancang konsep, level, mekanik game.</li>
                <li><strong>Game Programmer:</strong> Mengkodekan logika game.</li>
                <li><strong>Artist/Animator:</strong> Membuat karakter, environment, animasi.</li>
                <li><strong>Sound Designer:</strong> Membuat musik dan efek suara.</li>
                <li><strong>QA Tester:</strong> Menguji game mencari bug.</li>
                <li><strong>Producer:</strong> Mengelola proyek dan tim.</li>
              </ul>

              <h3>C. Kualifikasi Bekerja di Bidang IT</h3>
              <p>Lulusan SMK sudah punya bekal dasar. Persiapan yang dibutuhkan: Portofolio (kumpulan karya), Sertifikasi (contoh: CCNA, Oracle), Pengalaman Magang, dan Kemampuan Bahasa Inggris.</p>
            `
          },
          {
            chapter: "1.3 K3 di Lingkungan IT",
            content: `
              <h3>A. Apa Itu K3?</h3>
              <p>K3 = Keselamatan dan Kesehatan Kerja. K3 bertujuan melindungi pekerja dari kecelakaan dan penyakit akibat kerja.</p>

              <h3>B. Bahaya di Lingkungan IT</h3>
              <table>
                <tr><th>Jenis Bahaya</th><th>Contoh</th><th>Dampak</th></tr>
                <tr><td>Listrik</td><td>Kabel terbuka, stop kontak overload</td><td>Tersengat listrik, kebakaran</td></tr>
                <tr><td>Ergonomi</td><td>Posisi duduk salah, monitor terlalu rendah</td><td>Nyeri punggung, CVS (mata)</td></tr>
                <tr><td>Kebakaran</td><td>Kabel short, perangkat overheat</td><td>Kerusakan alat, bahaya jiwa</td></tr>
                <tr><td>Kesehatan Mental</td><td>Stres, burnout</td><td>Depresi, produktivitas turun</td></tr>
                <tr><td>Debu</td><td>Debu di dalam CPU, keyboard</td><td>Kerusakan perangkat, alergi</td></tr>
              </table>

              <h3>C. Pencegahan & Aturan Safety di Lab</h3>
              <p>Langkah pencegahan: Rapikan kabel, gunakan grounding, atur posisi monitor, pakai kursi ergonomis, istirahat tiap 1 jam, bersihkan komputer rutin, dan matikan perangkat jika tak digunakan.</p>
              <p><strong>5 Aturan Safety:</strong></p>
              <ul>
                <li>Jangan makan/minum di dekat komputer.</li>
                <li>Matikan komputer jika selesai menggunakan.</li>
                <li>Laporkan kerusakan ke guru/teknisi.</li>
                <li>Gunakan peralatan dengan benar.</li>
                <li>Jaga kebersihan lab komputer.</li>
              </ul>
            `
          },
          {
            chapter: "1.4 Ergonomi di Depan Komputer",
            content: `
              <h3>A. Apa Itu Ergonomi?</h3>
              <p>Ergonomi adalah ilmu yang mempelajari cara bekerja yang nyaman dan aman agar tubuh tidak sakit.</p>

              <h3>B. Posisi Duduk yang Benar</h3>
              <ul>
                <li>Mata sejajar dengan bagian atas monitor.</li>
                <li>Jarak mata ke monitor: 50-70 cm.</li>
                <li>Punggung tegak, bersandar ke kursi.</li>
                <li>Siku membentuk sudut 90°.</li>
                <li>Kaki menapak ke lantai.</li>
                <li>Pergelangan tangan lurus saat mengetik.</li>
              </ul>

              <h3>C. Aturan 20-20-20</h3>
              <p>Setiap 20 menit: Lihat ke arah sejauh 20 kaki (sekitar 6 meter) selama 20 detik.</p>

              <h3>D. Akibat Jika Ergonomi Buruk</h3>
              <ul>
                <li><strong>Computer Vision Syndrome (CVS):</strong> Mata lelah, kabur, sakit kepala.</li>
                <li><strong>Carpal Tunnel Syndrome:</strong> Nyeri pergelangan tangan.</li>
                <li><strong>Nyeri Punggung:</strong> Punggung bawah sakit, kaku.</li>
                <li><strong>Text Neck:</strong> Leher dan bahu sakit.</li>
              </ul>
            `
          },
          {
            chapter: "1.5 Budaya Kerja & 1.6 SOP",
            content: `
              <h3>1.5 Budaya Kerja Profesional</h3>
              <p>Budaya kerja adalah kebiasaan dan perilaku yang dilakukan di tempat kerja.</p>
              <ul>
                <li><strong>Nilai Budaya:</strong> Disiplin (tepat waktu), Jujur, Tanggung Jawab, Kerja Sama, Inisiatif (tidak menunggu perintah), Respek (menghargai pendapat).</li>
                <li><strong>Budaya Perusahaan IT:</strong> Agile (sprint 2-4 minggu, cepat adaptasi), Kolaborasi, Pembelajaran Berkelanjutan, Feedback (terbuka kritik/saran).</li>
              </ul>

              <h3>1.6 Prosedur Kerja dan SOP Dasar</h3>
              <p>SOP = Standar Operasional Prosedur, yaitu langkah-langkah baku untuk melakukan suatu pekerjaan.</p>
              <ul>
                <li><strong>SOP Menyalakan Komputer:</strong> 1) Pastikan kabel listrik terhubung, 2) Tekan tombol power CPU, 3) Tunggu layar login, 4) Masukkan username/password, 5) Tunggu desktop muncul.</li>
                <li><strong>SOP Mematikan Komputer:</strong> 1) Tutup semua aplikasi, 2) Klik Start -> Shutdown, 3) Tunggu sampai benar-benar mati, 4) Matikan monitor/stabilizer.</li>
                <li><strong>SOP Lab Komputer:</strong> Datang tepat waktu (5 menit sebelum jam), duduk di kursi ditentukan, larangan makan/minum, lapor jika ada kerusakan, jangan ubah setting tanpa izin.</li>
              </ul>
            `
          }
        ];

        // ------------------------------------------------------------
        // BANK SOAL (STRICTLY FROM TEXT)
        // ------------------------------------------------------------
        const rawQuestionBank = [
          { q: "Kemampuan yang harus dimiliki seseorang agar bisa bekerja dengan baik, produktif, dan profesional disebut...", options: ["Kecakapan kerja", "Pengalaman magang", "Budaya kerja", "SOP"], answer: "Kecakapan kerja" },
          { q: "Coding, menginstal jaringan, dan desain grafis merupakan contoh dari...", options: ["Hard Skills", "Soft Skills", "Kecerdasan emosional", "Budaya perusahaan"], answer: "Hard Skills" },
          { q: "Kemampuan interpersonal dan karakter seperti komunikasi, kerja tim, dan disiplin disebut...", options: ["Soft Skills", "Hard Skills", "Agile", "Etos kerja"], answer: "Soft Skills" },
          { q: "Salah satu contoh penerapan kecakapan 'Disiplin' bagi siswa SMK di sekolah adalah...", options: ["Datang ke sekolah tepat waktu", "Membuat karya orisinal", "Bekerja sama di lab", "Presentasi di depan kelas"], answer: "Datang ke sekolah tepat waktu" },
          { q: "Profesi di bidang IT yang memiliki tugas utama merancang konsep, level, dan mekanik sebuah permainan adalah...", options: ["Game Designer", "Game Programmer", "UI/UX Designer", "Artist/Animator"], answer: "Game Designer" },
          { q: "Profesi yang tugasnya mengelola database dan membutuhkan kemampuan SQL disebut...", options: ["Database Administrator", "System Analyst", "Network Engineer", "QA Tester"], answer: "Database Administrator" },
          { q: "Seseorang yang bertugas mendesain antarmuka aplikasi dan memperhatikan psikologi pengguna dikenal dengan nama profesi...", options: ["UI/UX Designer", "Programmer/Developer", "Sound Designer", "Producer"], answer: "UI/UX Designer" },
          { q: "Dalam bidang Game Development, tugas menguji game untuk mencari bug dilakukan oleh...", options: ["QA Tester", "Producer", "Game Programmer", "IT Support"], answer: "QA Tester" },
          { q: "Kumpulan karya (seperti aplikasi, game, website) yang bisa ditunjukkan sebagai kualifikasi bekerja disebut...", options: ["Portofolio", "Sertifikasi", "SOP", "CV (Curriculum Vitae)"], answer: "Portofolio" },
          { q: "Apa kepanjangan dari K3?", options: ["Keselamatan dan Kesehatan Kerja", "Keamanan dan Kebersihan Komputer", "Kenyamanan dan Kesehatan Kerja", "Keterampilan dan Kecakapan Kerja"], answer: "Keselamatan dan Kesehatan Kerja" },
          { q: "Berdasarkan materi, kabel terbuka dan stop kontak overload adalah contoh bahaya...", options: ["Listrik", "Ergonomi", "Kebakaran", "Kesehatan Mental"], answer: "Listrik" },
          { q: "Dampak dari bahaya kesehatan mental di lingkungan IT seperti stres dan burnout adalah...", options: ["Depresi dan produktivitas turun", "Tersengat listrik", "Nyeri punggung dan mata lelah", "Kerusakan perangkat dan alergi"], answer: "Depresi dan produktivitas turun" },
          { q: "Untuk mencegah kecelakaan listrik di lab komputer, salah satu caranya adalah dengan memastikan stop kontak memiliki...", options: ["Grounding", "Cable ties", "Kursi ergonomis", "Exhaust fan"], answer: "Grounding" },
          { q: "Menurut aturan safety di lab komputer, apa yang harus dilakukan jika ada kerusakan alat?", options: ["Melaporkan kerusakan ke guru/teknisi", "Memperbaiki sendiri", "Dibiarkan saja", "Mematikan listrik lab"], answer: "Melaporkan kerusakan ke guru/teknisi" },
          { q: "Ilmu yang mempelajari cara bekerja yang nyaman dan aman agar tubuh tidak sakit disebut...", options: ["Ergonomi", "K3", "SOP", "Psikologi pengguna"], answer: "Ergonomi" },
          { q: "Menurut ergonomi, berapakah jarak yang benar antara mata ke monitor komputer?", options: ["50-70 cm", "10-20 cm", "1-2 meter", "90 cm"], answer: "50-70 cm" },
          { q: "Bagaimana posisi yang benar untuk siku tangan saat menggunakan komputer?", options: ["Membentuk sudut 90°", "Lurus ke depan", "Menempel pada dada", "Ditekuk tajam"], answer: "Membentuk sudut 90°" },
          { q: "Aturan 20-20-20 menyarankan kita untuk beristirahat dan melihat sejauh 20 kaki selama...", options: ["20 detik", "20 menit", "20 milidetik", "20 jam"], answer: "20 detik" },
          { q: "Mata lelah, kabur, dan sakit kepala akibat ergonomi yang buruk adalah gejala dari...", options: ["Computer Vision Syndrome", "Carpal Tunnel Syndrome", "Text Neck", "Burnout"], answer: "Computer Vision Syndrome" },
          { q: "Nyeri pada pergelangan tangan akibat posisi kerja yang buruk disebut...", options: ["Carpal Tunnel Syndrome", "Text Neck", "Computer Vision Syndrome", "Skoliosis"], answer: "Carpal Tunnel Syndrome" },
          { q: "Kebiasaan dan perilaku yang dilakukan di tempat kerja disebut sebagai...", options: ["Budaya Kerja", "SOP", "Ergonomi", "Soft Skills"], answer: "Budaya Kerja" },
          { q: "Sikap tidak menunggu perintah dan proaktif dalam mencari solusi merupakan contoh nilai budaya kerja...", options: ["Inisiatif", "Respek", "Jujur", "Tanggung Jawab"], answer: "Inisiatif" },
          { q: "Budaya bekerja dalam sprint selama 2-4 minggu dan cepat beradaptasi dengan perubahan disebut...", options: ["Agile", "Kolaborasi", "Feedback", "SOP"], answer: "Agile" },
          { q: "Nilai budaya kerja berupa 'menghargai pendapat orang lain' masuk dalam kategori sikap...", options: ["Respek", "Kerja Sama", "Jujur", "Disiplin"], answer: "Respek" },
          { q: "Apa kepanjangan dari SOP?", options: ["Standar Operasional Prosedur", "Sistem Operasional Pusat", "Standar Output Perusahaan", "Sistem Organisasi Pekerjaan"], answer: "Standar Operasional Prosedur" },
          { q: "Langkah pertama dalam contoh SOP menyalakan komputer lab adalah...", options: ["Pastikan kabel listrik terhubung", "Tekan tombol power pada CPU", "Tunggu hingga desktop muncul", "Masukkan username dan password"], answer: "Pastikan kabel listrik terhubung" },
          { q: "Menurut SOP mematikan komputer dengan benar, apa yang dilakukan sebelum mengklik Start -> Shutdown?", options: ["Tutup semua aplikasi yang terbuka", "Matikan monitor dan stabilizer", "Tunggu komputer benar-benar mati", "Cabut kabel listrik"], answer: "Tutup semua aplikasi yang terbuka" },
          { q: "Menurut contoh SOP lab komputer, berapa menit siswa harus datang sebelum jam pelajaran dimulai?", options: ["5 menit sebelum jam pelajaran", "Tepat saat bel berbunyi", "15 menit sebelum guru datang", "Kapan saja asalkan sebelum selesai"], answer: "5 menit sebelum jam pelajaran" },
          { q: "Sikap 'tidak menunda-nunda' dan 'menyelesaikan tugas pada waktunya' adalah ciri siswa SMK yang mempraktikkan...", options: ["Tanggung Jawab atas tugas / Disiplin", "Kolaborasi tim", "Agile programming", "Pembelajaran berkelanjutan"], answer: "Tanggung Jawab atas tugas / Disiplin" },
          { q: "Sesuai materi, mengapa kita perlu selalu belajar teknologi baru (pembelajaran berkelanjutan)?", options: ["Karena teknologi berubah dengan cepat", "Untuk mendapatkan sertifikat", "Agar bisa membuat game", "Sebagai syarat membuat SOP"], answer: "Karena teknologi berubah dengan cepat" }
        ];

        // ------------------------------------------------------------
        // UTILITY & STATE
        // ------------------------------------------------------------
        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        let state = {
            screen: 'home',
            playerName: '',
            activeTab: 0,
            questions: [],
            currentQIndex: 0,
            wrongCount: 0,
            score: 0,
            selectedAnswer: null,
            shuffledOptions: []
        };

        const MAX_WRONG = 10;
        const TOTAL_QUESTIONS = rawQuestionBank.length; // 30 questions
        const root = document.getElementById('root');

        // ------------------------------------------------------------
        // RENDER FUNCTIONS
        // ------------------------------------------------------------
        function renderHome() {
            return `
                <div class="flex flex-col items-center justify-center min-h-screen p-6 text-center animate-fade-in bg-slate-50">
                    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-8 border-indigo-600">
                        <h1 class="text-3xl font-extrabold text-gray-800 mb-2">Kuis Interaktif</h1>
                        <p class="text-indigo-600 font-bold mb-4">Bab 1: Pengenalan Dunia Kerja & K3 IT</p>
                        <p class="text-gray-500 mb-8 text-sm">Pelajari materi terlebih dahulu atau langsung uji pengetahuanmu!</p>
                        
                        <div class="relative mb-6">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-user text-gray-400"></i>
                            </div>
                            <input id="playerNameInput" type="text"
                                class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl leading-5 bg-gray-50 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all"
                                placeholder="Masukkan Namamu..."
                                value="${state.playerName}"
                                oninput="updatePlayerName(this.value)"
                            />
                        </div>

                        <div class="space-y-4">
                            <button onclick="setScreen('material')" 
                                class="w-full flex items-center justify-center gap-2 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 font-bold py-3 px-4 rounded-xl transition-all shadow-sm">
                                <i class="fas fa-book"></i> Baca Materi
                            </button>
                            
                            <button onclick="startQuiz()" 
                                class="w-full flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-md transform hover:scale-105">
                                <i class="fas fa-gamepad"></i> Mulai Kuis!
                            </button>
                        </div>
                    </div>
                    <p class="mt-8 text-sm text-gray-500 max-w-sm">
                        Ada ${TOTAL_QUESTIONS} soal yang diambil khusus dari materi Bab 1. Hati-hati dengan ${MAX_WRONG} batas kesalahan!
                    </p>
                </div>
            `;
        }

        function renderMaterial() {
            const tabsHtml = materials.map((mat, idx) => `
                <button onclick="setActiveTab(${idx})" 
                    class="w-full text-left p-3 rounded-lg transition-all text-sm font-medium ${state.activeTab === idx ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}">
                    ${mat.chapter}
                </button>
            `).join('');

            const content = materials[state.activeTab].content;

            return `
                <div class="flex flex-col min-h-screen bg-gray-50 p-4 md:p-8 animate-fade-in">
                    <div class="max-w-5xl mx-auto w-full bg-white rounded-2xl shadow-lg overflow-hidden flex flex-col md:flex-row min-h-[80vh]">
                        
                        <!-- Sidebar Tabs -->
                        <div class="w-full md:w-1/3 bg-slate-800 text-white p-6 flex flex-col">
                            <button onclick="setScreen('home')" 
                                class="flex items-center gap-2 text-slate-300 hover:text-white mb-8 transition-colors w-fit bg-slate-700 p-2 rounded-lg text-sm">
                                <i class="fas fa-arrow-left"></i> Kembali ke Menu
                            </button>
                            <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                                <i class="fas fa-book-open text-indigo-400"></i> Materi Bab 1
                            </h2>
                            <div class="flex-1 overflow-y-auto space-y-2 pr-2">
                                ${tabsHtml}
                            </div>
                        </div>

                        <!-- Content Area -->
                        <div class="w-full md:w-2/3 p-6 md:p-10 overflow-y-auto max-h-[80vh] prose prose-indigo">
                            <h2 class="text-2xl font-extrabold text-gray-800 mb-6 border-b pb-4">
                                ${materials[state.activeTab].chapter}
                            </h2>
                            <div class="text-gray-700 leading-relaxed text-[15px]">
                                ${content}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderQuiz() {
            if (!state.questions.length) return '<div>Loading...</div>';
            const question = state.questions[state.currentQIndex];
            const progress = ((state.currentQIndex) / TOTAL_QUESTIONS) * 100;

            let optionsHtml = state.shuffledOptions.map((opt) => {
                let btnStyle = "bg-gray-50 border-gray-200 text-gray-700 hover:bg-indigo-50 hover:border-indigo-300";
                let iconHtml = '';

                if (state.selectedAnswer) {
                    if (opt === question.answer) {
                        btnStyle = "bg-emerald-100 border-emerald-500 text-emerald-800";
                        iconHtml = '<i class="fas fa-check-circle text-emerald-600"></i>';
                    } else if (opt === state.selectedAnswer) {
                        btnStyle = "bg-rose-100 border-rose-500 text-rose-800";
                        iconHtml = '<i class="fas fa-times-circle text-rose-600"></i>';
                    } else {
                        btnStyle = "bg-gray-50 border-gray-100 text-gray-400 opacity-50";
                    }
                }

                const disabled = state.selectedAnswer ? 'disabled' : '';

                return `
                    <button ${disabled} onclick="handleAnswer('${opt.replace(/'/g, "\\'")}')" 
                        class="w-full text-left p-4 rounded-xl border-2 font-medium transition-all flex justify-between items-center ${btnStyle}">
                        <span>${opt}</span>
                        ${iconHtml ? `<span>${iconHtml}</span>` : ''}
                    </button>
                `;
            }).join('');

            return `
                <div class="flex flex-col min-h-screen bg-slate-100 p-4 md:p-8 items-center justify-center animate-fade-in">
                    <div class="w-full max-w-2xl bg-white rounded-3xl shadow-xl overflow-hidden">
                        
                        <!-- Header -->
                        <div class="bg-indigo-600 p-6 text-white flex justify-between items-center">
                            <div>
                                <p class="text-indigo-200 text-sm font-medium uppercase tracking-wider">Pemain</p>
                                <p class="font-bold text-lg flex items-center gap-2">
                                    <i class="fas fa-user"></i> ${state.playerName}
                                </p>
                            </div>
                            <div class="text-right">
                                <p class="text-indigo-200 text-sm font-medium uppercase tracking-wider">Salah Maks. ${MAX_WRONG}</p>
                                <div class="flex items-center gap-1 text-rose-300 font-bold text-lg justify-end">
                                    ${state.wrongCount} salah
                                    <i class="fas fa-heart-crack ${state.wrongCount >= (MAX_WRONG - 2) ? 'animate-pulse text-rose-500' : ''}"></i>
                                </div>
                            </div>
                        </div>

                        <!-- Progress Bar -->
                        <div class="w-full bg-indigo-100 h-2">
                            <div class="bg-emerald-500 h-2 transition-all duration-500" style="width: ${progress}%;"></div>
                        </div>

                        <!-- Question Section -->
                        <div class="p-6 md:p-10">
                            <div class="flex justify-between text-sm font-bold text-gray-400 mb-4">
                                <span>Pertanyaan ${state.currentQIndex + 1} / ${TOTAL_QUESTIONS}</span>
                                <span>Skor: ${state.score}</span>
                            </div>
                            
                            <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-8 min-h-[80px]">
                                ${question.q}
                            </h3>

                            <div class="space-y-3">
                                ${optionsHtml}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderGameOver() {
            return `
                <div class="flex flex-col items-center justify-center min-h-screen p-6 text-center bg-rose-50 animate-fade-in">
                    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md border-t-8 border-rose-500">
                        <div class="w-20 h-20 bg-rose-100 rounded-full flex items-center justify-center mx-auto mb-6">
                            <i class="fas fa-heart-crack text-rose-500 text-4xl"></i>
                        </div>
                        <h1 class="text-4xl font-extrabold text-gray-800 mb-2">Game Over!</h1>
                        <p class="text-gray-600 mb-6 text-lg">Yah, ${state.playerName}... Kamu telah mencapai batas ${MAX_WRONG} kesalahan.</p>
                        
                        <div class="bg-gray-50 rounded-xl p-4 mb-8 border border-gray-200">
                            <p class="text-sm text-gray-500 font-medium">Skor yang Kamu Kumpulkan</p>
                            <p class="text-3xl font-bold text-indigo-600">${state.score}</p>
                        </div>

                        <button onclick="setScreen('home')" 
                            class="w-full flex items-center justify-center gap-2 bg-rose-600 hover:bg-rose-700 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-lg transform hover:-translate-y-1">
                            Kembali ke Menu
                        </button>
                    </div>
                </div>
            `;
        }

        function renderResult() {
            const percentage = (state.score / TOTAL_QUESTIONS) * 100;
            let grade = "";
            let color = "";
            if (percentage >= 90) { grade = "Luar Biasa!"; color = "text-emerald-600"; }
            else if (percentage >= 70) { grade = "Bagus Sekali!"; color = "text-blue-600"; }
            else if (percentage >= 50) { grade = "Cukup Baik."; color = "text-yellow-600"; }
            else { grade = "Silakan Baca Materi Lagi."; color = "text-rose-600"; }

            return `
                <div class="flex flex-col items-center justify-center min-h-screen p-6 text-center bg-indigo-50 animate-fade-in">
                    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md border-t-8 border-emerald-500 relative overflow-hidden">
                        
                        <div class="absolute top-0 left-0 w-full h-32 bg-gradient-to-b from-emerald-100 to-transparent pointer-events-none"></div>

                        <div class="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-6 relative z-10 shadow-inner">
                            <i class="fas fa-trophy text-emerald-500 text-4xl"></i>
                        </div>
                        <h1 class="text-3xl font-extrabold text-gray-800 mb-2 relative z-10">Selesai, ${state.playerName}!</h1>
                        <p class="text-gray-600 mb-6 font-medium relative z-10">Kamu berhasil menyelesaikan kuis Bab 1.</p>
                        
                        <div class="bg-slate-50 rounded-2xl p-6 mb-8 border border-slate-100 relative z-10 shadow-sm">
                            <p class="text-sm text-gray-500 font-bold uppercase tracking-widest mb-1">Skor Akhir</p>
                            <p class="text-5xl font-black text-slate-800 mb-2">${state.score} <span class="text-2xl text-slate-400">/ ${TOTAL_QUESTIONS}</span></p>
                            <p class="font-bold text-lg ${color}">${grade}</p>
                        </div>

                        <button onclick="setScreen('home')" 
                            class="w-full flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-lg transform hover:-translate-y-1 relative z-10">
                            Main Lagi
                        </button>
                    </div>
                </div>
            `;
        }

        // ------------------------------------------------------------
        // APP LOGIC
        // ------------------------------------------------------------
        let isRendering = false;

        function renderApp() {
            if (isRendering) return;
            isRendering = true;
            
            let html = '';
            switch (state.screen) {
                case 'home': html = renderHome(); break;
                case 'material': html = renderMaterial(); break;
                case 'quiz': html = renderQuiz(); break;
                case 'gameover': html = renderGameOver(); break;
                case 'result': html = renderResult(); break;
                default: html = '<div>Error Screen</div>';
            }
            root.innerHTML = html;
            
            if (state.screen === 'home') {
                const input = document.getElementById('playerNameInput');
                if (input) {
                    const newInput = input.cloneNode(true);
                    input.parentNode.replaceChild(newInput, input);
                    newInput.addEventListener('input', function(e) {
                        state.playerName = e.target.value;
                    });
                }
            }
            
            isRendering = false;
        }

        window.updatePlayerName = function(val) {
            state.playerName = val;
        };

        window.setScreen = function(screen) {
            if (screen === 'home') {
                state = { ...state, screen: 'home', playerName: state.playerName };
                state.questions = [];
                state.currentQIndex = 0;
                state.wrongCount = 0;
                state.score = 0;
                state.selectedAnswer = null;
                state.shuffledOptions = [];
            } else {
                state.screen = screen;
            }
            renderApp();
        };

        window.setActiveTab = function(idx) {
            state.activeTab = idx;
            renderApp();
        };

        window.startQuiz = function() {
            if (!state.playerName.trim()) {
                alert("Masukkan namamu dulu ya sebelum mulai kuis!");
                return;
            }
            // Acak urutan pertanyaan
            const shuffled = shuffleArray(rawQuestionBank);
            state.questions = shuffled;
            state.currentQIndex = 0;
            state.wrongCount = 0;
            state.score = 0;
            state.selectedAnswer = null;
            // Acak opsi jawaban di soal pertama
            state.shuffledOptions = shuffleArray(shuffled[0].options);
            state.screen = 'quiz';
            renderApp();
        };

        window.handleAnswer = function(option) {
            if (state.selectedAnswer) return; // Prevent double click

            const question = state.questions[state.currentQIndex];
            const correct = option === question.answer;

            state.selectedAnswer = option;

            if (correct) {
                state.score += 1;
            } else {
                state.wrongCount += 1;
            }

            // Tampilkan warna hijau/merah
            renderApp();

            // Lanjut ke soal berikutnya setelah delay
            setTimeout(() => {
                if (!correct && state.wrongCount >= MAX_WRONG) {
                    state.screen = 'gameover';
                    renderApp();
                    return;
                }
                if (state.currentQIndex + 1 >= TOTAL_QUESTIONS) {
                    state.screen = 'result';
                    renderApp();
                    return;
                }
                
                const nextIndex = state.currentQIndex + 1;
                state.currentQIndex = nextIndex;
                state.selectedAnswer = null;
                state.shuffledOptions = shuffleArray(state.questions[nextIndex].options);
                renderApp();
            }, 1200);
        };

        // Mulai aplikasi
        renderApp();
    </script>
</body>
</html>
