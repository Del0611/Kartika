        // RENDER FUNCTIONS
        // ------------------------------------------------------------
        function renderHome() {
            return `
                <div class="flex flex-col items-center justify-center min-h-screen p-6 text-center animate-fade-in bg-slate-50">
                    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-8 border-indigo-600">
                        <h1 class="text-3xl font-extrabold text-gray-800 mb-2">Kuis Interaktif</h1>
                        <p class="text-indigo-600 font-bold mb-4">Bab 1: Pengenalan Dunia Kerja & K3 IT</p>
                        <p class="text-gray-500 mb-8 text-sm">Pelajari materi terlebih dahulu atau langsung uji pengetahuanmu!</p>
                        
                        <div class="relative mb-6">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-user text-gray-400"></i>
                            </div>
                            <input id="playerNameInput" type="text"
                                class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl leading-5 bg-gray-50 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all"
                                placeholder="Masukkan Namamu..."
                                value="${state.playerName}"
                                oninput="updatePlayerName(this.value)"
                            />
                        </div>

                        <div class="space-y-4">
                            <button onclick="setScreen('material')" 
                                class="w-full flex items-center justify-center gap-2 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 font-bold py-3 px-4 rounded-xl transition-all shadow-sm">
                                <i class="fas fa-book"></i> Baca Materi
                            </button>
                            
                            <button onclick="startQuiz()" 
                                class="w-full flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-md transform hover:scale-105">
                                <i class="fas fa-gamepad"></i> Mulai Kuis!
                            </button>
                        </div>
                    </div>
                    <p class="mt-8 text-sm text-gray-500 max-w-sm">
                        Ada ${TOTAL_QUESTIONS} soal yang diambil 100% dari materi Bab 1. Hati-hati dengan ${MAX_WRONG} batas kesalahan!
                    </p>
                </div>
            `;
        }

        function renderMaterial() {
            const tabsHtml = materials.map((mat, idx) => `
                <button onclick="setActiveTab(${idx})" 
                    class="w-full text-left p-3 rounded-lg transition-all text-sm font-medium ${state.activeTab === idx ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}">
                    ${mat.chapter}
                </button>
            `).join('');

            const content = materials[state.activeTab].content;

            return `
                <div class="flex flex-col min-h-screen bg-gray-50 p-4 md:p-8 animate-fade-in">
                    <div class="max-w-5xl mx-auto w-full bg-white rounded-2xl shadow-lg overflow-hidden flex flex-col md:flex-row min-h-[80vh]">
                        
                        <!-- Sidebar Tabs -->
                        <div class="w-full md:w-1/3 bg-slate-800 text-white p-6 flex flex-col">
                            <button onclick="setScreen('home')" 
                                class="flex items-center gap-2 text-slate-300 hover:text-white mb-8 transition-colors w-fit bg-slate-700 p-2 rounded-lg text-sm">
                                <i class="fas fa-arrow-left"></i> Kembali ke Menu
                            </button>
                            <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                                <i class="fas fa-book-open text-indigo-400"></i> Materi Bab 1
                            </h2>
                            <div class="flex-1 overflow-y-auto space-y-2 pr-2">
                                ${tabsHtml}
                            </div>
                        </div>

                        <!-- Content Area -->
                        <div class="w-full md:w-2/3 p-6 md:p-10 overflow-y-auto max-h-[80vh] prose prose-indigo">
                            <h2 class="text-2xl font-extrabold text-gray-800 mb-6 border-b pb-4">
                                ${materials[state.activeTab].chapter}
                            </h2>
                            <div class="text-gray-700 leading-relaxed text-[15px]">
                                ${content}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderQuiz() {
            if (!state.questions.length) return '<div>Loading...</div>';
            const question = state.questions[state.currentQIndex];
            const progress = ((state.currentQIndex) / TOTAL_QUESTIONS) * 100;

            let optionsHtml = state.shuffledOptions.map((opt) => {
                let btnStyle = "bg-gray-50 border-gray-200 text-gray-700 hover:bg-indigo-50 hover:border-indigo-300";
                let iconHtml = '';

                if (state.selectedAnswer) {
                    if (opt === question.answer) {
                        btnStyle = "bg-emerald-100 border-emerald-500 text-emerald-800";
                        iconHtml = '<i class="fas fa-check-circle text-emerald-600"></i>';
                    } else if (opt === state.selectedAnswer) {
                        btnStyle = "bg-rose-100 border-rose-500 text-rose-800";
                        iconHtml = '<i class="fas fa-times-circle text-rose-600"></i>';
                    } else {
                        btnStyle = "bg-gray-50 border-gray-100 text-gray-400 opacity-50";
                    }
                }

                const disabled = state.selectedAnswer ? 'disabled' : '';

                return `
                    <button ${disabled} onclick="handleAnswer('${opt.replace(/'/g, "\\'")}')" 
                        class="w-full text-left p-4 rounded-xl border-2 font-medium transition-all flex justify-between items-center ${btnStyle}">
                        <span>${opt}</span>
                        ${iconHtml ? `<span>${iconHtml}</span>` : ''}
                    </button>
                `;
            }).join('');

            return `
                <div class="flex flex-col min-h-screen bg-slate-100 p-4 md:p-8 items-center justify-center animate-fade-in">
                    <div class="w-full max-w-2xl bg-white rounded-3xl shadow-xl overflow-hidden">
                        
                        <!-- Header -->
                        <div class="bg-indigo-600 p-6 text-white flex justify-between items-center">
                            <div>
                                <p class="text-indigo-200 text-sm font-medium uppercase tracking-wider">Pemain</p>
                                <p class="font-bold text-lg flex items-center gap-2">
                                    <i class="fas fa-user"></i> ${state.playerName}
                                </p>
                            </div>
                            <div class="text-right">
                                <p class="text-indigo-200 text-sm font-medium uppercase tracking-wider">Salah Maks. ${MAX_WRONG}</p>
                                <div class="flex items-center gap-1 text-rose-300 font-bold text-lg justify-end">
                                    ${state.wrongCount} salah
                                    <i class="fas fa-heart-crack ${state.wrongCount >= (MAX_WRONG - 3) ? 'animate-pulse text-rose-500' : ''}"></i>
                                </div>
                            </div>
                        </div>

                        <!-- Progress Bar -->
                        <div class="w-full bg-indigo-100 h-2">
                            <div class="bg-emerald-500 h-2 transition-all duration-500" style="width: ${progress}%;"></div>
                        </div>

                        <!-- Question Section -->
                        <div class="p-6 md:p-10">
                            <div class="flex justify-between text-sm font-bold text-gray-400 mb-4">
                                <span>Pertanyaan ${state.currentQIndex + 1} / ${TOTAL_QUESTIONS}</span>
                                <span>Skor: ${state.score}</span>
                            </div>
                            
                            <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-8 min-h-[80px]">
                                ${question.q}
                            </h3>

                            <div class="space-y-3">
                                ${optionsHtml}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderGameOver() {
            return `
                <div class="flex flex-col items-center justify-center min-h-screen p-6 text-center bg-rose-50 animate-fade-in">
                    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md border-t-8 border-rose-500">
                        <div class="w-20 h-20 bg-rose-100 rounded-full flex items-center justify-center mx-auto mb-6">
                            <i class="fas fa-heart-crack text-rose-500 text-4xl"></i>
                        </div>
                        <h1 class="text-4xl font-extrabold text-gray-800 mb-2">Game Over!</h1>
                        <p class="text-gray-600 mb-6 text-lg">Yah, ${state.playerName}... Kamu telah mencapai batas ${MAX_WRONG} kesalahan.</p>
                        
                        <div class="bg-gray-50 rounded-xl p-4 mb-8 border border-gray-200">
                            <p class="text-sm text-gray-500 font-medium">Skor yang Kamu Kumpulkan</p>
                            <p class="text-3xl font-bold text-indigo-600">${state.score}</p>
                        </div>

                        <button onclick="setScreen('home')" 
                            class="w-full flex items-center justify-center gap-2 bg-rose-600 hover:bg-rose-700 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-lg transform hover:-translate-y-1">
                            Kembali ke Menu
                        </button>
                    </div>
                </div>
            `;
        }

        function renderResult() {
            const percentage = (state.score / TOTAL_QUESTIONS) * 100;
            let grade = "";
            let color = "";
            if (percentage >= 90) { grade = "Luar Biasa!"; color = "text-emerald-600"; }
            else if (percentage >= 70) { grade = "Bagus Sekali!"; color = "text-blue-600"; }
            else if (percentage >= 50) { grade = "Cukup Baik."; color = "text-yellow-600"; }
            else { grade = "Silakan Baca Materi Lagi."; color = "text-rose-600"; }

            return `
                <div class="flex flex-col items-center justify-center min-h-screen p-6 text-center bg-indigo-50 animate-fade-in">
                    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md border-t-8 border-emerald-500 relative overflow-hidden">
                        
                        <div class="absolute top-0 left-0 w-full h-32 bg-gradient-to-b from-emerald-100 to-transparent pointer-events-none"></div>

                        <div class="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-6 relative z-10 shadow-inner">
                            <i class="fas fa-trophy text-emerald-500 text-4xl"></i>
                        </div>
                        <h1 class="text-3xl font-extrabold text-gray-800 mb-2 relative z-10">Selesai, ${state.playerName}!</h1>
                        <p class="text-gray-600 mb-6 font-medium relative z-10">Kamu berhasil menyelesaikan kuis Bab 1 (50 Soal).</p>
                        
                        <div class="bg-slate-50 rounded-2xl p-6 mb-8 border border-slate-100 relative z-10 shadow-sm">
                            <p class="text-sm text-gray-500 font-bold uppercase tracking-widest mb-1">Skor Akhir</p>
                            <p class="text-5xl font-black text-slate-800 mb-2">${state.score} <span class="text-2xl text-slate-400">/ ${TOTAL_QUESTIONS}</span></p>
                            <p class="font-bold text-lg ${color}">${grade}</p>
                        </div>

                        <button onclick="setScreen('home')" 
                            class="w-full flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-lg transform hover:-translate-y-1 relative z-10">
                            Main Lagi
                        </button>
                    </div>
                </div>
            `;
        }

        // ------------------------------------------------------------
        // APP LOGIC
        // ------------------------------------------------------------
        let isRendering = false;

        function renderApp() {
            if (isRendering) return;
            isRendering = true;
            
            let html = '';
            switch (state.screen) {
                case 'home': html = renderHome(); break;
                case 'material': html = renderMaterial(); break;
                case 'quiz': html = renderQuiz(); break;
                case 'gameover': html = renderGameOver(); break;
                case 'result': html = renderResult(); break;
                default: html = '<div>Error Screen</div>';
            }
            root.innerHTML = html;
            
            if (state.screen === 'home') {
                const input = document.getElementById('playerNameInput');
                if (input) {
                    const newInput = input.cloneNode(true);
                    input.parentNode.replaceChild(newInput, input);
                    newInput.addEventListener('input', function(e) {
                        state.playerName = e.target.value;
                    });
                }
            }
            
            isRendering = false;
        }

        window.updatePlayerName = function(val) {
            state.playerName = val;
        };

        window.setScreen = function(screen) {
            if (screen === 'home') {
                state = { ...state, screen: 'home', playerName: state.playerName };
                state.questions = [];
                state.currentQIndex = 0;
                state.wrongCount = 0;
                state.score = 0;
                state.selectedAnswer = null;
                state.shuffledOptions = [];
            } else {
                state.screen = screen;
            }
            renderApp();
        };

        window.setActiveTab = function(idx) {
            state.activeTab = idx;
            renderApp();
        };

        window.startQuiz = function() {
            if (!state.playerName.trim()) {
                alert("Masukkan namamu dulu ya sebelum mulai kuis!");
                return;
            }
            // Acak urutan pertanyaan
            const shuffled = shuffleArray(rawQuestionBank);
            state.questions = shuffled;
            state.currentQIndex = 0;
            state.wrongCount = 0;
            state.score = 0;
            state.selectedAnswer = null;
            // Acak opsi jawaban di soal pertama
            state.shuffledOptions = shuffleArray(shuffled[0].options);
            state.screen = 'quiz';
            renderApp();
        };

        window.handleAnswer = function(option) {
            if (state.selectedAnswer) return; // Prevent double click

            const question = state.questions[state.currentQIndex];
            const correct = option === question.answer;

            state.selectedAnswer = option;

            if (correct) {
                state.score += 1;
            } else {
                state.wrongCount += 1;
            }

            // Tampilkan warna hijau/merah
            renderApp();

            // Lanjut ke soal berikutnya setelah delay
            setTimeout(() => {
                if (!correct && state.wrongCount >= MAX_WRONG) {
                    state.screen = 'gameover';
                    renderApp();
                    return;
                }
                if (state.currentQIndex + 1 >= TOTAL_QUESTIONS) {
                    state.screen = 'result';
                    renderApp();
                    return;
                }
                
                const nextIndex = state.currentQIndex + 1;
                state.currentQIndex = nextIndex;
                state.selectedAnswer = null;
                state.shuffledOptions = shuffleArray(state.questions[nextIndex].options);
                renderApp();
            }, 1200);
        };

        // Mulai aplikasi
        renderApp();
    </script>
</body>
</html>
